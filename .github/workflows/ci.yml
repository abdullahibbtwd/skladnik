name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=@skladnik/api

      - name: Build shared
        run: npm run build --workspace=@skladnik/shared

      - name: Typecheck
        run: npm run typecheck

      - name: API unit tests
        run: npm test --workspace=@skladnik/api

      - name: Web build
        run: npm run build --workspace=@skladnik/web

# Dev infra only: Postgres, Redis, MinIO.
# Full stack (also web + api): docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: skladnik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skladnik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skladnik}
      POSTGRES_DB: ${POSTGRES_DB:-skladnik}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skladnik} -d ${POSTGRES_DB:-skladnik}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - skladnik

  redis:
    image: redis:7-alpine
    container_name: skladnik-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - skladnik

  minio:
    image: minio/minio:latest
    container_name: skladnik-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - skladnik

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  skladnik:
    name: skladnik
    driver: bridge
